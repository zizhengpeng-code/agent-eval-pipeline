<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="960" height="220" rx="14" fill="url(#bg)"/>
  <rect width="960" height="220" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="960" height="4" rx="2" fill="url(#accent)"/>
  <rect x="0.5" y="0.5" width="959" height="219" rx="13.5" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Left terminal-style emblem -->
  <g transform="translate(52, 54)">
    <rect width="48" height="48" rx="10" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 15 18 L 22 24 L 15 30" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="25" y1="30" x2="34" y2="30" stroke="#34d399" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Title & subtitle -->
  <text x="118" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">agent-eval-pipeline</text>
  <text x="52" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">
    Zero-dependency evaluation harness for complex document &amp; spreadsheet agents (Excel / Word / PDF)
  </text>

  <!-- Feature pills -->
  <g transform="translate(52, 156)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <rect x="0" y="0" width="194" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="18" fill="#e2e8f0">Offline Excel AST Recalc</text>

    <rect x="206" y="0" width="166" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="220" cy="14" r="4" fill="#818cf8"/>
    <text x="232" y="18" fill="#e2e8f0">SHA-256 Task Freeze</text>

    <rect x="384" y="0" width="168" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="398" cy="14" r="4" fill="#34d399"/>
    <text x="410" y="18" fill="#e2e8f0">Isolated Blind Eval</text>

    <rect x="564" y="0" width="150" height="28" rx="6" fill="#161b22" stroke="#30363d"/>
    <circle cx="578" cy="14" r="4" fill="#f59e0b"/>
    <text x="590" y="18" fill="#e2e8f0">Python 3.9+ Stdlib</text>
  </g>
</svg>
