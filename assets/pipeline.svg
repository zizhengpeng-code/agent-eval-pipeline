      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="150" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Step 1 -->
  <g transform="translate(24, 28)">
    <rect width="156" height="94" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect width="156" height="3" rx="1.5" fill="#38bdf8"/>
    <text x="14" y="28" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#38bdf8">01 / AUTHOR</text>
    <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Task Pack</text>
    <text x="14" y="70" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#94a3b8">task.md + refs</text>
    <text x="14" y="84" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#94a3b8">gt + rubric</text>
  </g>
  <line x1="184" y1="75" x2="206" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(212, 28)">
