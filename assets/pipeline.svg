    <rect width="156" height="3" rx="1.5" fill="#34d399"/>
    <text x="14" y="28" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#34d399">04 / BLIND EVAL</text>
    <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">run_blind_eval</text>
