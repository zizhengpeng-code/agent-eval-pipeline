    <rect width="156" height="3" rx="1.5" fill="#818cf8"/>
    <text x="14" y="28" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#818cf8">02 / GATE 1–2</text>
    <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">validate-task</text>
    <text x="14" y="70" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#94a3b8">anti-spoiler check</text>
    <text x="14" y="84" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#94a3b8">100pt rubric + GT</text>
  </g>
  <line x1="372" y1="75" x2="394" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(400, 28)">
    <rect width="156" height="94" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect width="156" height="3" rx="1.5" fill="#a78bfa"/>
    <text x="14" y="28" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#a78bfa">03 / FREEZE</text>
    <text x="14" y="50" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">freeze-task</text>
    <text x="14" y="70" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#94a3b8">SHA-256 manifest</text>
    <text x="14" y="84" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#94a3b8">verify before run</text>
  </g>
  <line x1="560" y1="75" x2="582" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

